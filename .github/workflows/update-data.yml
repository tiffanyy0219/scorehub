name: 自動更新賽程資料

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝套件
        run: cd scripts && npm install

      - name: 建立 data 資料夾
        run: mkdir -p data

      - name: 執行資料更新
        run: cd scripts && node fetch-all.js

      - name: 提交並推送更新
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --staged --quiet || git commit -m "自動更新賽程資料 $(date '+%Y-%m-%d %H:%M')"
          git push
