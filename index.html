<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ScoreHub">
  <link rel="manifest" href="manifest.json">
  <title>ScoreHub</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">SCORE<em>HUB</em></div>
      <div class="header-right">
        <span class="live-dot"><span class="pulse"></span>LIVE</span>
        <span class="upd-time" id="upd-time">--:--</span>
      </div>
    </div>
    <nav class="sport-nav" id="sport-nav">
      <button class="sport-btn active" data-sport="baseball">⚾ 棒球</button>
      <button class="sport-btn" data-sport="basketball">🏀 籃球</button>
      <button class="sport-btn" data-sport="soccer">⚽ 足球</button>
      <button class="sport-btn" data-sport="f1">🏎 F1</button>
      <button class="sport-btn" data-sport="tennis">🎾 網球</button>
    </nav>
    <div class="league-bar" id="league-bar"></div>
  </header>

  <!-- View tabs -->
  <div class="view-bar">
    <button class="view-btn active" data-view="schedule">賽程</button>
    <button class="view-btn" data-view="live">即時</button>
    <button class="view-btn" data-view="standings">排行</button>
  </div>

  <!-- Content -->
  <main class="content" id="content">
    <div class="skeleton-wrap">
      <div class="sk-card"></div>
      <div class="sk-card"></div>
      <div class="sk-card"></div>
    </div>
  </main>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="schedule">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
      <span>賽程</span>
    </button>
    <button class="nav-btn" data-view="live">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
      <span>即時</span>
    </button>
    <button class="nav-btn" data-view="standings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>排行</span>
    </button>
    <button class="nav-btn" data-view="favorites">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span>最愛</span>
    </button>
    <button class="nav-btn" id="settings-nav-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>設定</span>
    </button>
  </nav>

  <!-- Settings Panel -->
  <div class="side-panel" id="settings-panel">
    <div class="panel-hdr">
      <button class="back-btn" id="settings-close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="panel-title">設定</span>
    </div>
    <div class="panel-body" id="settings-body"></div>
  </div>

</div>
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
